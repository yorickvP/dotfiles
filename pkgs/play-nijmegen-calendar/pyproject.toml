[build-system]
requires = ["setuptools>=45", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "play-nijmegen-calendar"
version = "0.1.0"
description = "Generate iCal file for Play Nijmegen events"
requires-python = ">=3.7"
dependencies = [
    "beautifulsoup4",
    "icalendar",
    "pytz",
    "requests",
]

[project.scripts]
play-nijmegen-calendar = "main:main"

[tool.uv]
exclude-newer = "7d"
